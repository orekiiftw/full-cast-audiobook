# `bun test` globs the whole repo by default, which would also pick up the Expo app's Jest
# suite under mobile/ (it imports react-native and cannot run on Bun). Scope Bun's test
# runner to the server/client tree; the mobile package runs its own Jest suite.
#
# `--isolate` (in the test script and in CI) gives every test file a fresh global and module
# registry: src/api/routes/books.test.ts mocks the acquisition module at file scope, and
# without isolation that mock leaks into whichever file runs next.
[test]
root = "./src"
